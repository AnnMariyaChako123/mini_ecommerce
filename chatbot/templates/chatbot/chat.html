
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Store Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 30px 15px;
        }

        .chat-container {
            width: 100%;
            max-width: 450px;
            margin: 30px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #cccccc;
            overflow: hidden;
        }

        .chat-header {
            background: #ff3f6c;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .chat-header h2 {
            margin: 0 0 8px;
        }

        .chat-header p {
            margin: 0;
            font-size: 14px;
        }

        .chat-messages {
            height: 350px;
            padding: 15px;
            overflow-y: auto;
        }

        .message {
            padding: 10px 12px;
            margin: 8px 0;
            border-radius: 8px;
            max-width: 85%;
            overflow-wrap: anywhere;
        }

        .user-message {
            background: #ffe0e8;
            margin-left: auto;
            text-align: right;
        }

        .bot-message {
            background: #eeeeee;
            margin-right: auto;
        }

        .chat-input {
            display: flex;
            padding: 12px;
            border-top: 1px solid #dddddd;
            gap: 8px;
        }

        .chat-input input {
            flex: 1;
            min-width: 0;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            outline-color: #ff3f6c;
        }

        .chat-input button {
            background: #ff3f6c;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .chat-input button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .chat-footer {
            text-align: center;
            padding: 10px;
            color: #777777;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <div class="chat-header">
            <h2>Store Assistant</h2>
            <p>How can we help you?</p>
        </div>

        <div class="chat-messages" id="chatMessages"
             aria-live="polite">
            <div class="message bot-message">
                Hello! Welcome to our store.
                Ask me about products, orders, payment or delivery.
            </div>
        </div>

        <form class="chat-input" id="chatForm">
            {% csrf_token %}

            <input
                type="text"
                id="userMessage"
                name="message"
                placeholder="Type your message..."
                autocomplete="off"
                required
            >

            <button type="submit" id="sendButton">
                Send
            </button>
        </form>

        <div class="chat-footer">
            Powered by Store Assistant
        </div>

    </div>

    <script>
        const chatForm = document.getElementById("chatForm");
        const userInput = document.getElementById("userMessage");
        const chatMessages = document.getElementById("chatMessages");
        const sendButton = document.getElementById("sendButton");

        function addMessage(message, className) {
            const messageDiv = document.createElement("div");

            messageDiv.className = "message " + className;
            messageDiv.textContent = message;

            chatMessages.appendChild(messageDiv);

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        chatForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const message = userInput.value.trim();

            if (!message) {
                return;
            }

            addMessage(message, "user-message");

            userInput.value = "";
            sendButton.disabled = true;

            try {
                const response = await fetch("/chatbot/message/", {
                    method: "POST",

                    headers: {
                        "X-CSRFToken": getCookie("csrftoken"),
                        "Content-Type": "application/x-www-form-urlencoded"
                    },

                    body: new URLSearchParams({
                        message: message
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.reply || "Unable to process your message."
                    );
                }

                addMessage(data.reply, "bot-message");

            } catch (error) {
                console.error("Chatbot error:", error);

                addMessage(
                    "Sorry, something went wrong. Please try again.",
                    "bot-message"
                );

            } finally {
                sendButton.disabled = false;
                userInput.focus();
            }
        });

        function getCookie(name) {
            const cookies = document.cookie.split(";");

            for (let cookie of cookies) {
                cookie = cookie.trim();

                if (cookie.startsWith(name + "=")) {
                    return decodeURIComponent(
                        cookie.substring(name.length + 1)
                    );
                }
            }

            return "";
        }
    </script>

</body>
</html>
